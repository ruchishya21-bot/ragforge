services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ragforge-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragforge

    ports:
      - "5433:5432"

    volumes:
      - ragforge-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ragforge"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ragforge-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ragforge

      LLM_PROVIDER: ollama
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: llama3.2:3b

    ports:
      - "8001:8000"

volumes:
  ragforge-postgres-data: